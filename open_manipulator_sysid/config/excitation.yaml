# Phase 1 excitation defaults for OpenMANIPULATOR-X Arm (joint1–joint4).
# Gripper joints are intentionally excluded.

arm_joints:
  - joint1
  - joint2
  - joint3
  - joint4

# Hard limits from open_manipulator_x URDF (rad).
joint_limits:
  joint1:
    lower: -3.141592653589793
    upper: 3.141592653589793
  joint2:
    lower: -1.5
    upper: 1.5
  joint3:
    lower: -1.5
    upper: 1.4
  joint4:
    lower: -1.7
    upper: 1.97

# Neutral pose: midpoint of each joint hard limit (rad).
q0:
  joint1: 0.0
  joint2: 0.0
  joint3: -0.05
  joint4: 0.135

excitation:
  num_harmonics: 5
  period_s: 10.0
  # Peak-to-peak position span as a fraction of each joint hard limit range.
  amplitude_fraction: 0.3

safety:
  # Soft limits inset from hard limits (fraction of full range).
  soft_limit_inset_fraction: 0.1
  max_velocity_rad_s: 1.0
  max_acceleration_rad_s2: 2.0

# Used by online excitation nodes (Issue 03+); not consumed by offline generator yet.
approach:
  duration_s: 5.0
  hold_duration_s: 2.0
