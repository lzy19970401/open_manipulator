# Hardware compensation-mode evaluation (see docs/open-manipulator-x-compensation-evaluation.md).
# Arm only; used as metadata reference for bags and offline scripts.

arm_joints:
  - joint1
  - joint2
  - joint3
  - joint4

compensation_modes:
  G:
    enable_coriolis_compensation: false
    enable_friction_compensation: false
  G+C:
    enable_coriolis_compensation: true
    enable_friction_compensation: false
  G+C+F:
    enable_coriolis_compensation: true
    enable_friction_compensation: true

validation_poses:
  P01_init:
    joint1: 0.0
    joint2: 0.0
    joint3: 0.0
    joint4: 0.0
  P02_home:
    joint1: 0.0
    joint2: -1.0
    joint3: 0.7
    joint4: 0.3
  P03_ready:
    joint1: 0.0
    joint2: -1.0
    joint3: 1.0
    joint4: 0.0
  P04_sysid_q0:
    joint1: 0.0
    joint2: 0.0
    joint3: -0.05
    joint4: 0.135
  P05_reach_forward:
    joint1: 0.0
    joint2: -0.5
    joint3: 0.8
    joint4: 0.0
  P06_yaw_plus:
    joint1: 1.2
    joint2: -0.8
    joint3: 0.3
    joint4: 0.5

static_hold:
  total_duration_s: 8.0
  trim_start_s: 2.0
  trim_end_s: 0.0
  max_velocity_rad_s: 0.02
  max_acceleration_rad_s2: 0.5

backdrive_trial_BD01:
  sequence:
    - {pose: P01_init, action: hold, duration_s: 3.0}
    - {pose: P02_home, action: move, duration_s: 10.0}
    - {pose: P02_home, action: hold, duration_s: 3.0}
    - {pose: P03_ready, action: move, duration_s: 10.0}
    - {pose: P03_ready, action: hold, duration_s: 3.0}
    - {pose: P05_reach_forward, action: move, duration_s: 10.0}
    - {pose: P05_reach_forward, action: hold, duration_s: 3.0}
    - {pose: P01_init, action: move, duration_s: 10.0}
  repeats_per_mode: 3

constant_velocity_CV01:
  target_speed_rad_s: 0.5
  speed_band_rad_s: [0.35, 0.65]
  duration_s: 6.0
  joints: [joint2, joint3]

recording:
  topics:
    - /joint_states
  sample_dt_s: 0.01
  resample_smooth_window: 11

metrics:
  primary:
    - rms_dynamics_residual
    - wastage_power
  static:
    - rms_gravity_residual
  secondary:
    - p95_dynamics_residual
    - corr_with_velocity
