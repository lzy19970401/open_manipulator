# 其实这个文件是 controllers.yaml 更合适 因为可以是硬件 也可以用于仿真
/**:    # /**: 是 YAML 的根节点，表示这是一个 YAML 文档的开始
  controller_manager:
    ros__parameters:
      update_rate: 200  #100  # Hz  

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      gripper_controller:
        type: position_controllers/GripperActionController

/**:
  arm_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4

      interface_name: position

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      allow_partial_joints_goal: true

/**:
  gripper_controller:
    ros__parameters:
      joint: gripper_left_joint
