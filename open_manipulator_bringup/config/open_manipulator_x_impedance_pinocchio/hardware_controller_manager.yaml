/**:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz — OMX USB 1 Mbps read ~5 ms

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      pinocchio_impedance_controller:
        type: pinocchio_impedance_controller/PinocchioImpedanceController

/**:
  pinocchio_impedance_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
      passive_state_joints:
        - gripper_left_joint
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      reference_pose_mode: capture_on_activate
      # reference_pose_mode: fixed
      fixed_reference_positions:
        - 0.0
        - -1.0
        - 1.0
        - 0.0
      stiffness:
        - 1.0
        - 0.6
        - 0.6
        - 0.2
      damping:
        - 0.08
        - 0.01
        - 0.01
        - 0.014
      reference_transition_max_velocity:
        - 0.5
        - 0.5
        - 0.5
        - 0.5
      effort_sign_flips:
        - 1.0
        - 1.0
        - 1.0
        - 1.0
      torque_scaling_factors:
        - 1.0
        - 0.8
        - 1.0
        - 0.8
      #这里的摩擦过补偿了 暂时关闭
      enable_friction_compensation: false 
      viscous_friction_coefficients: 
        - 0.49
        - 1.15
        - 0.85
        - 0.19
      coulomb_friction_coefficients:
        - 0.0
        - 0.0
        - 0.0
        - 0.0
      friction_velocity_deadzone: 0.001
